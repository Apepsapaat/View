<!DOCTYPE html>
<html>
<head>
    <title>Inventory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<h1>LOCATION INVENTORY</h1>

<input id="barcodeInput" placeholder="Scan / Input Barcode">
<button onclick="searchItem()">Cari</button>
<button onclick="scanCamera()">📷 Kamera</button>

<div class="card">
    <p>BARCODE : <span id="barcode">-</span></p>
    <p>ITEM : <span id="item">-</span></p>
    <p>DESC : <span id="desc">-</span></p>
    <p>LOKASI : <span id="lokasi">-</span></p>
    <p>QTY : <span id="qty">-</span></p>
</div>

<button onclick="updateQty(1)">+ Qty</button>
<button onclick="updateQty(-1)">- Qty</button>

<div id="reader"></div>

<div id="addForm" style="display:none;">
    <h3>Tambah Barang Baru</h3>
    <input id="newItem" placeholder="Item"><br>
    <input id="newDesc" placeholder="Desc"><br>
    <input id="newLokasi" placeholder="Lokasi"><br>
    <input id="newQty" placeholder="Qty"><br>
    <button onclick="addItem()">Simpan</button>
</div>

<script src="script.js"></script>
</body>
</html>
